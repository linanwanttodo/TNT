name: "Setup Component"
description: "Cache and install dependencies for a specific component"
inputs:
  component:
    description: "Component directory relative to the repository root (core, binary, packages/cli)"
    required: true
  include-packages:
    description: "Whether to include packages cache (default: true)"
    required: false
    default: "true"
  include-root:
    description: "Whether to include root cache (default: false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"

    - uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-${{ inputs.component }}-${{ hashFiles(format('{0}/package-lock.json', inputs.component)) }}

    - uses: actions/cache@v5
      if: inputs.include-packages == 'true'
      with:
        path: |
          packages/*/node_modules
        key: ${{ runner.os }}-packages-node-modules-${{ hashFiles('packages/*/package-lock.json') }}

    - uses: actions/cache@v5
      if: inputs.include-root == 'true'
      id: root-cache
      with:
        path: node_modules
        key: ${{ runner.os }}-root-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install root dependencies
      if: inputs.include-root == 'true' && steps.root-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - uses: actions/cache@v5
      id: component-cache
      with:
        path: ${{ format('{0}/node_modules', inputs.component) }}
        key: ${{ runner.os }}-${{ inputs.component }}-node-modules-${{ hashFiles(format('{0}/package-lock.json', inputs.component)) }}

    - name: Install component dependencies
      if: steps.component-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMPONENT_DIR: ${{ inputs.component }}
      run: |
        set -euo pipefail
        cd "$COMPONENT_DIR"
        npm ci

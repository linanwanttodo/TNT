name: CLI PR Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "*.md"
      - "**/*.md"

  # Work lands on main through a direct push as well as through a PR. A gate
  # that only listens to pull_request would never run for those commits, which
  # is how a broken install path stayed invisible.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "*.md"
      - "**/*.md"

# One transcript-changing push at a time per ref; superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  track-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.run_attempt > 1
    steps:
      - uses: actions/checkout@v6
      - name: Track workflow rerun
        uses: ./.github/actions/track-rerun

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Build the SDK that the CLI bundles
        shell: bash
        # Installing the CLI also runs its prepare script, which bundles the CLI
        # and imports the generated SDK. scripts/build-packages.js only runs the
        # typescript package's own no-op build, so without this step the bundle
        # cannot resolve @tnt/sdk and npm ci fails on every operating system.
        run: |
          cd packages/sdk/typescript
          npm install --no-audit --no-fund
          cd api
          npm install --no-audit --no-fund
          cd ..
          npm run build

      - name: Install dependencies
        run: |
          cd packages/cli
          npm ci --include=optional

      - name: Run linting
        run: |
          cd packages/cli
          npm run lint

  test:
    strategy:
      matrix:
        # The floor (ubuntu + node 20, matching the engines field) runs the full
        # e2e suite; each other operating system runs one current LTS. Node 18
        # left the matrix when engines moved to >=20; widen here, not per-PR.
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json

      - name: Cache CLI node_modules
        uses: actions/cache@v5
        with:
          path: packages/cli/node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-cli-modules-${{ hashFiles('packages/cli/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-cli-modules-

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Build the SDK that the CLI bundles
        shell: bash
        # Installing the CLI also runs its prepare script, which bundles the CLI
        # and imports the generated SDK. scripts/build-packages.js only runs the
        # typescript package's own no-op build, so without this step the bundle
        # cannot resolve @tnt/sdk and npm ci fails on every operating system.
        run: |
          cd packages/sdk/typescript
          npm install --no-audit --no-fund
          cd api
          npm install --no-audit --no-fund
          cd ..
          npm run build

      - name: Install dependencies
        run: |
          cd packages/cli
          npm ci --include=optional

      - name: Build
        run: |
          cd packages/cli
          npm run build

      - name: Run smoke tests
        run: |
          cd packages/cli
          npm run test:smoke

      - name: Run tests
        run: |
          cd packages/cli
          npm test

      # Windows e2e ran red on stdout that had not drained before exit; the
      # exit path now waits for the pipe. Keep the TUI/PTY suites off Windows,
      # but the headless suites are cross-platform and run here.
      - name: Run headless e2e tests
        if: matrix.os == 'windows-latest'
        run: |
          cd packages/cli
          npx vitest run --config vitest.e2e.config.ts headless
      - name: Run e2e tests
        if: matrix.os != 'windows-latest'
        run: |
          cd packages/cli
          npm run test:e2e

  smoke-api:
    # Needs in-repo credentials. On a push event there is no pull_request
    # context, so this skips and the aggregate job allows the skip.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Build the SDK that the CLI bundles
        shell: bash
        # Installing the CLI also runs its prepare script, which bundles the CLI
        # and imports the generated SDK. scripts/build-packages.js only runs the
        # typescript package's own no-op build, so without this step the bundle
        # cannot resolve @tnt/sdk and npm ci fails on every operating system.
        run: |
          cd packages/sdk/typescript
          npm install --no-audit --no-fund
          cd api
          npm install --no-audit --no-fund
          cd ..
          npm run build

      - name: Install dependencies
        run: |
          cd packages/cli
          npm ci --include=optional

      - name: Build
        run: |
          cd packages/cli
          npm run build

      - name: Run smoke API tests
        env:
          # The name is the upstream proxy service's contract, not a TNT switch.
          CONTINUE_API_KEY: ${{ secrets.CONTINUE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd packages/cli
          npm run test:smoke-api

  # GitHub does not have a way of requiring that all checks pass (you must manually select each job)
  # This action at least lets us manage the list of required tests via source control
  # so that creators of new jobs can add them to this list
  require-all-checks-to-pass-cli:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint
      - test
      - smoke-api

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          # smoke-api is allowed to skip for fork PRs that lack secrets
          allowed-skips: smoke-api
          jobs: ${{ toJSON(needs) }}

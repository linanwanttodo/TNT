name: Release the CLI for every desktop OS

# The sqlite3 binding inside the tarball is native, so each platform's asset
# must be assembled on that platform. Bump packages/cli/package.json and push a
# v<version> tag (or run this from main) before dispatching.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (must match packages/cli/package.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  assemble:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-14
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Check the requested version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "packages/cli/package.json is $actual, not $VERSION" >&2
            exit 1
          fi

      - name: Install the CLI's dependencies
        shell: bash
        working-directory: packages/cli
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the local packages
        shell: bash
        working-directory: packages/cli
        env:
          # The script chains `cd` through sibling packages; Git Bash handles
          # the forward slashes on Windows too.
          npm_config_script_shell: bash
        run: npm run build:local-deps

      - name: Assemble the platform tarball
        shell: bash
        env:
          TNT_PLATFORM: ${{ matrix.platform }}
        run: bash packages/cli/scripts/package-release.sh

      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "TNT CLI $tag" --generate-notes
          gh release upload "$tag" \
            "packages/cli/tnt-cli-v$VERSION-$PLATFORM.tar.gz" --clobber

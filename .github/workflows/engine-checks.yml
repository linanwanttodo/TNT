name: Engine Checks

# The engine layer (core plus the npm packages) is checked here; the CLI surface
# has its own workflow. Both triggers matter: work lands on main directly, and a
# gate that only listens to pull_request would never see it.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Documentation-only commits cannot break the engine, and this repository takes
# a lot of them.
paths-ignore:
  - "docs/**"
  - "docs-site/**"
  - "*.md"
  - "**/*.md"

# One run per ref at a time; superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # A run with no provider credentials must not attempt the live provider tests.
  TNT_HAS_PROVIDER_KEYS: ${{ secrets.OPENAI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  track-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.run_attempt > 1
    steps:
      - uses: actions/checkout@v6
      - name: Track workflow rerun
        uses: ./.github/actions/track-rerun

  prettier-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check code formatting with Prettier
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}" --ignore-path .gitignore --ignore-path .prettierignore

  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for git diff to work
      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Check if LLM-related files changed
        id: llm-changes
        uses: ./.github/actions/check-llm-changes
        with:
          is_fork: ${{ github.event.pull_request.head.repo.fork == true }}
          is_dependabot: ${{ github.actor == 'dependabot[bot]' }}
          has_provider_keys: ${{ env.TNT_HAS_PROVIDER_KEYS }}

      - name: Type check and lint
        run: |
          cd core
          npx tsc --noEmit
          npm run lint

      - name: Run tests
        run: |
          cd core
          npm test
          npm run vitest
        env:
          IGNORE_API_KEY_TESTS: ${{ steps.llm-changes.outputs.ignore_api_tests }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_FOUNDRY_CODESTRAL_API_KEY: ${{ secrets.AZURE_FOUNDRY_CODESTRAL_API_KEY }}
          AZURE_FOUNDRY_MISTRAL_SMALL_API_KEY: ${{ secrets.AZURE_FOUNDRY_MISTRAL_SMALL_API_KEY }}
          AZURE_OPENAI_GPT41_API_KEY: ${{ secrets.AZURE_OPENAI_GPT41_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          RELACE_API_KEY: ${{ secrets.RELACE_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}

  get-packages-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - name: Get package list
        id: get-packages
        # `cli` is covered by CLI PR Checks, which builds and tests it on three
        # operating systems; repeating the whole suite here doubles the cost.
        run: |
          packages=$(find packages/ -maxdepth 1 -type d -not -path packages/ \
            -exec test -e '{}/package.json' ';' -print \
            | xargs -n1 basename | grep -vx cli | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "Found packages: $packages"

  packages-checks:
    needs: get-packages-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.get-packages-matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for git diff to work
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Check if LLM-related files changed
        id: llm-changes
        uses: ./.github/actions/check-llm-changes
        with:
          is_fork: ${{ github.event.pull_request.head.repo.fork == true }}
          is_dependabot: ${{ github.actor == 'dependabot[bot]' }}
          has_provider_keys: ${{ env.TNT_HAS_PROVIDER_KEYS }}

      - name: Test and check ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          npm ci
          npm test
        env:
          IGNORE_API_KEY_TESTS: ${{ steps.llm-changes.outputs.ignore_api_tests }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_FOUNDRY_CODESTRAL_API_KEY: ${{ secrets.AZURE_FOUNDRY_CODESTRAL_API_KEY }}
          AZURE_FOUNDRY_MISTRAL_SMALL_API_KEY: ${{ secrets.AZURE_FOUNDRY_MISTRAL_SMALL_API_KEY }}
          AZURE_OPENAI_GPT41_API_KEY: ${{ secrets.AZURE_OPENAI_GPT41_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          RELACE_API_KEY: ${{ secrets.RELACE_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}

  # GitHub has no way to require that every check passes, so the list of gates
  # lives in source control and new jobs are added here.
  require-all-checks-to-pass:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prettier-check
      - core-checks
      - get-packages-matrix
      - packages-checks

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

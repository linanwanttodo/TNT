name: Stable Release

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Version for stable release (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # Required for OIDC

jobs:
  stable-release:
    name: Stable Release
    runs-on: ubuntu-latest
    # Only run this workflow on the main repository (linanwanttodo/TNT)
    if: github.repository == 'linanwanttodo/TNT'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Update version
        working-directory: packages/cli
        run: npm version ${{ inputs.stable_version }} --no-git-tag-version

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Run tests
        working-directory: packages/cli
        run: npm test

      - name: Setup Node.js for OIDC publish
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: packages/cli
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --tag latest --provenance
          echo "Published version: ${{ inputs.stable_version }}"

      - name: Create release on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ inputs.stable_version }}"
          git push origin "v${{ inputs.stable_version }}"

          gh release create "v${{ inputs.stable_version }}" \
            --title "CLI Release v${{ inputs.stable_version }}" \
            --notes "Release v${{ inputs.stable_version }} built and published from the main branch." \
            --latest

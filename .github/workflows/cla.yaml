name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run this workflow on the main repository (linanwanttodo/TNT).
    # Bot-authored PRs (dependabot) have no human committer to sign, and an
    # update-branch brings the maintainer's commits into the PR, so the action
    # would demand a signature from the repository owner on every sync.
    if: >-
      github.repository == 'linanwanttodo/TNT' &&
      (github.event_name == 'issue_comment' ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.type != 'Bot'))
    steps:
      - name: "CLA Assistant"
        if: (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/linanwanttodo/TNT/blob/main/CLA.md"
          branch: cla-signatures
          # Bots and CLAs signed outside of GitHub
          allowlist: dependabot[bot],action@github.com,snyk-bot,google-labs-jules[bot]
          signed-commit-message: "CLA signed in $pullRequestNo"

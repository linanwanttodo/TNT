name: "TNT PR Review"
description: "Automated code review for pull requests using TNT CLI"
author: "TNT"

inputs:
  agent-file:
    description: "Repository-relative agent markdown file to review with (e.g. .tnt/agents/review.md)"
    required: true
  config-file:
    description: "Optional assistant configuration file; defaults to the one the CLI finds in the checkout"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check Authorization
      id: auth-check
      uses: actions/github-script@v7
      with:
        script: |
          let shouldRun = false;
          let skipReason = '';

          if (context.eventName === 'pull_request') {
            // Check if PR is a draft
            if (context.payload.pull_request.draft) {
              skipReason = 'PR is a draft';
            } else {
              // Check if user has write permission (includes admin, maintain, write)
              const prAuthor = context.payload.pull_request.user.login;
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: prAuthor
                });
                
                const allowedPermissions = ['admin', 'maintain', 'write'];
                if (allowedPermissions.includes(permission.permission)) {
                  shouldRun = true;
                  console.log(`PR author @${prAuthor} has ${permission.permission} permission`);
                } else {
                  skipReason = `PR author @${prAuthor} does not have write permission (has: ${permission.permission})`;
                }
              } catch (error) {
                // If API call fails, fall back to checking author_association
                const association = context.payload.pull_request.author_association;
                const allowedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
                if (allowedAssociations.includes(association)) {
                  shouldRun = true;
                  console.log(`PR author @${prAuthor} association: ${association}`);
                } else {
                  skipReason = `PR author @${prAuthor} is not a team member (association: ${association})`;
                }
              }
            }
          } else if (context.eventName === 'issue_comment') {
            // Check if it's a PR comment with the trigger phrase
            const hasTrigger = context.payload.comment.body.includes('@tnt-review');
            if (context.payload.issue.pull_request && hasTrigger) {
              const commenter = context.payload.comment.user.login;
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: commenter
                });
                
                const allowedPermissions = ['admin', 'maintain', 'write'];
                if (allowedPermissions.includes(permission.permission)) {
                  shouldRun = true;
                  console.log(`Commenter @${commenter} has ${permission.permission} permission`);
                } else {
                  skipReason = `Commenter @${commenter} does not have write permission (has: ${permission.permission})`;
                }
              } catch (error) {
                // If API call fails, fall back to checking author_association
                const association = context.payload.comment.author_association;
                const allowedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
                if (allowedAssociations.includes(association)) {
                  shouldRun = true;
                  console.log(`Commenter @${commenter} association: ${association}`);
                } else {
                  skipReason = `Commenter @${commenter} is not a team member (association: ${association})`;
                }
              }
            } else {
              skipReason = 'Comment does not contain @tnt-review trigger, or is not on a PR';
            }
          } else {
            skipReason = `Unsupported event type: ${context.eventName}`;
          }

          if (skipReason) {
            core.notice(`Skipping review - ${skipReason}`);
          }

          core.exportVariable('SHOULD_RUN', shouldRun.toString());
          return shouldRun;

    - name: Setup Node.js
      if: env.SHOULD_RUN == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install TNT CLI
      if: env.SHOULD_RUN == 'true'
      shell: bash
      run: npm install -g @tnt/cli@latest

    - name: Setup Action Scripts
      if: env.SHOULD_RUN == 'true'
      shell: bash
      run: |
        # Create directory for scripts
        mkdir -p .tnt-action-scripts

        # Check if we're running in the TNT repo itself (scripts exist locally)
        if [ -f "actions/general-review/scripts/buildPrompt.js" ] && [ -f "actions/general-review/scripts/writeMarkdown.js" ]; then
          echo "Running in TNT repo - using local scripts from current checkout"
          cp actions/general-review/scripts/buildPrompt.js .tnt-action-scripts/buildPrompt.js
          cp actions/general-review/scripts/writeMarkdown.js .tnt-action-scripts/writeMarkdown.js
        else
          echo "Running in external repo - downloading scripts from the TNT repo"
          
          # Download scripts from the TNT repo
          echo "Downloading buildPrompt.js..."
          curl -sSL https://raw.githubusercontent.com/linanwanttodo/TNT/main/actions/general-review/scripts/buildPrompt.js \
            -o .tnt-action-scripts/buildPrompt.js
          
          echo "Downloading writeMarkdown.js..."
          curl -sSL https://raw.githubusercontent.com/linanwanttodo/TNT/main/actions/general-review/scripts/writeMarkdown.js \
            -o .tnt-action-scripts/writeMarkdown.js
        fi

        # Verify scripts exist
        if [ ! -f .tnt-action-scripts/buildPrompt.js ]; then
          echo "Error: buildPrompt.js not found"
          exit 1
        fi

        if [ ! -f .tnt-action-scripts/writeMarkdown.js ]; then
          echo "Error: writeMarkdown.js not found"
          exit 1
        fi

        echo "Scripts ready:"
        ls -lh .tnt-action-scripts/

    - name: Post Initial Comment
      if: env.SHOULD_RUN == 'true'
      id: initial-comment
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- tnt-agent-review -->';

          // Get PR number based on event type
          let prNumber;
          if (context.eventName === 'pull_request') {
            prNumber = context.payload.pull_request.number;
          } else {
            // For issue_comment event
            prNumber = context.payload.issue.number;
          }

          // Check for existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100
          });

          // Find existing TNT review comment
          const existingComment = comments
            .filter(c => c.body && c.body.includes(marker))
            .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];

          // Get workflow run URL
          const workflowRunUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          // Create initial "review in progress" message
          let initialMessage = `${marker}\n**🔄 Review In Progress**\n\n`;

          if (context.eventName === 'issue_comment') {
            initialMessage = `${marker}\n**🔄 Review In Progress**\n\n*Triggered by @${context.payload.comment.user.login}'s request*\n\n`;
          }

          initialMessage += `TNT is analyzing the code changes...\n\n`;
          initialMessage += `📊 **Review Scope:**\n`;
          initialMessage += `- Repository: ${context.repo.owner}/${context.repo.repo}\n`;
          initialMessage += `- PR #${prNumber}\n\n`;
          initialMessage += `⏱️ This typically takes 1-2 minutes.\n\n`;
          initialMessage += `[View live progress →](${workflowRunUrl})\n\n`;
          initialMessage += `---\n<!-- ${new Date().toISOString()} | Powered by TNT (https://github.com/linanwanttodo/TNT) -->`;

          if (existingComment) {
            // Check if comment is less than 1 hour old
            const commentAge = Date.now() - new Date(existingComment.created_at).getTime();
            const oneHour = 60 * 60 * 1000;

            if (commentAge < oneHour) {
              // Update existing comment if less than 1 hour old
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: initialMessage
              });
              console.log(`Updated existing comment ${existingComment.id} to show review in progress`);
              core.setOutput('comment_id', existingComment.id);
            } else {
              // Create new comment if older than 1 hour (preserve history)
              const { data: comment } = await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: initialMessage
              });
              console.log(`Created new comment ${comment.id} showing review in progress`);
              core.setOutput('comment_id', comment.id);
            }
          } else {
            // Create new comment
            const { data: comment } = await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: initialMessage
            });
            console.log(`Created new comment ${comment.id} on PR #${prNumber}`);
            core.setOutput('comment_id', comment.id);
          }

    - name: Build PR Review Prompt
      if: env.SHOULD_RUN == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Get PR number based on event type
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.number }}"
        else
          # For issue_comment event on a PR
          PR_NUMBER="${{ github.event.issue.number }}"
        fi

        # Gather PR context and build prompt without heredocs
        gh pr diff "$PR_NUMBER" > pr_diff.txt
        gh pr view "$PR_NUMBER" --json title,author,body,files > pr_data.json
        node .tnt-action-scripts/buildPrompt.js "$PR_NUMBER"
        rm -f pr_data.json

    - name: Run TNT CLI Review
      if: env.SHOULD_RUN == 'true'
      shell: bash
      env:
        TNT_AGENT_FILE: ${{ inputs.agent-file }}
        TNT_CONFIG_FILE: ${{ inputs.config-file }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        echo "Running TNT CLI with prompt:"
        echo "=================================="
        head -n 100 review_prompt.txt
        echo "... [truncated] ..."
        echo "=================================="
        echo ""

        # The review runs on the assistant configuration found in the checkout, and
        # the model credential comes from whatever that file names in the job
        # environment. Nothing here passes a key to the CLI, because nothing reads one.
        skip_cli=false
        if [ -z "$TNT_AGENT_FILE" ] || [ ! -f "$TNT_AGENT_FILE" ]; then
          echo "Warning: the agent file is not in the checkout: $TNT_AGENT_FILE"
          node .tnt-action-scripts/writeMarkdown.js code_review.md missing_agent_file
          skip_cli=true
        fi

        # Validate the paths before a shell sees them. An agent is a local markdown
        # file now, so a two-part slug cannot work and both values stay inside a
        # plain path charset.
        if [[ ! "$TNT_AGENT_FILE" =~ ^[A-Za-z0-9_./-]+$ ]]; then
          echo "Error: Invalid agent file path. Use a repository-relative markdown path."
          exit 1
        fi

        if [ -n "$TNT_CONFIG_FILE" ] && [[ ! "$TNT_CONFIG_FILE" =~ ^[A-Za-z0-9_./-]+$ ]]; then
          echo "Error: Invalid config file path. Use a repository-relative path."
          exit 1
        fi

        # Test TNT CLI availability. `$GITHUB_ENV` only reaches later steps, so the
        # decision that skips the run below has to live in this shell.
        if [ "$skip_cli" != "true" ]; then
          echo "Testing TNT CLI..."
          if ! which tnt > /dev/null 2>&1; then
            echo "Warning: TNT CLI not found or not working"
            node .tnt-action-scripts/writeMarkdown.js code_review.md cli_install_failed
            skip_cli=true
          else
            echo "TNT CLI found at: $(which tnt)"
            echo "TNT CLI version: $(tnt --version 2>/dev/null || echo 'version check failed')"
          fi
        fi

        # Run the CLI with the validated agent file
        if [ "$skip_cli" != "true" ]; then
          echo "Executing TNT CLI with agent file: $TNT_AGENT_FILE"

          CLI_ARGS=(--agent "$TNT_AGENT_FILE")
          if [ -n "$TNT_CONFIG_FILE" ]; then
            CLI_ARGS+=(--config "$TNT_CONFIG_FILE")
          fi

          # The prompt is piped in: `-p` is a switch rather than a value, and a
          # headless turn reads stdin. Bash is not allowed on purpose - the reviewer
          # has the diff the action already wrote, and needs no shell in a checkout
          # of a branch that may not be trusted.
          echo "Executing command: tnt ${CLI_ARGS[*]} -p"

          # Use timeout to prevent hanging (360 seconds = 6 minutes)
          if timeout 360 tnt "${CLI_ARGS[@]}" -p < review_prompt.txt > code_review_raw.md 2>cli_error.log; then
            echo "TNT CLI completed successfully"
            echo "Raw output length: $(wc -c < code_review_raw.md) characters"
            
            # Clean up ANSI codes if any
            sed 's/\x1b\[[0-9;]*m//g' code_review_raw.md > code_review.md
            
            echo "Cleaned output length: $(wc -c < code_review.md) characters"
            echo "First 500 chars of output:"
            head -c 500 code_review.md
            echo ""
            
            # Check if output is empty
            if [ ! -s code_review.md ]; then
              echo "Warning: TNT CLI returned empty output"
              node .tnt-action-scripts/writeMarkdown.js code_review.md empty_output
            fi
          else
            echo "Error: TNT CLI command failed with exit code $?"
            echo "CLI error log:"
            cat cli_error.log
            
            # Check for specific error patterns
            if grep -q "not found\|ENOENT" cli_error.log 2>/dev/null; then
              node .tnt-action-scripts/writeMarkdown.js code_review.md cli_not_found
            elif grep -q "config\|assistant" cli_error.log 2>/dev/null; then
              node .tnt-action-scripts/writeMarkdown.js code_review.md config_error
            elif grep -q "api\|auth" cli_error.log 2>/dev/null; then
              node .tnt-action-scripts/writeMarkdown.js code_review.md auth_error
            else
              node .tnt-action-scripts/writeMarkdown.js code_review.md generic_failure
            fi
          fi
        else
          echo "Skipped the CLI run; code_review.md holds the reason"
        fi

        echo "SKIP_CLI=$skip_cli" >> $GITHUB_ENV

    - name: Upload Review Results
      if: env.SHOULD_RUN == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: code-review-results
        path: |
          code_review.md
          review_prompt.txt
          pr_diff.txt
        retention-days: 30

    - name: Update Comment with Review
      if: env.SHOULD_RUN == 'true' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          try {
            let reviewContent = '';

            if (fs.existsSync('code_review.md') && fs.statSync('code_review.md').size > 0) {
              reviewContent = fs.readFileSync('code_review.md', 'utf8');
            } else {
              // Build direct link to workflow logs
              const workflowRunUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              reviewContent = `⚠️ AI review completed but no review output was generated.\n\n**Likely cause:** the agent file or assistant configuration is missing, or the provider refused the run's credentials\n\n[📋 View workflow logs](${workflowRunUrl}) for details.`;
            }

            // Get PR number based on event type
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else {
              // For issue_comment event
              prNumber = context.payload.issue.number;
            }

            // Add a header if triggered by comment
            if (context.eventName === 'issue_comment') {
              reviewContent = `*Triggered by @${context.payload.comment.user.login}'s request*\n\n${reviewContent}`;
            }

            // Add footer with timestamp and branding
            const timestamp = new Date().toISOString();
            reviewContent += `\n\n---\n<!-- ${timestamp} | Powered by TNT (https://github.com/linanwanttodo/TNT) -->`;

            // Look for existing review comment to update (sticky comment)
            const marker = '<!-- tnt-agent-review -->';

            // Try to get comment_id from the initial comment step
            const initialCommentId = '${{ steps.initial-comment.outputs.comment_id }}';

            if (initialCommentId && initialCommentId !== '') {
              // We have the comment ID from the initial step, use it directly
              reviewContent = `${marker}\n**✅ Review Complete**\n\n${reviewContent}`;

              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: parseInt(initialCommentId),
                  body: reviewContent
                });
                console.log(`Updated comment ${initialCommentId} with review results`);
              } catch (updateError) {
                console.log(`Failed to update comment ${initialCommentId}, will search for it instead:`, updateError.message);

                // Fallback: search for the comment
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100
                });

                // Find existing TNT review comment
                const existingComment = comments
                  .filter(c => c.body && c.body.includes(marker))
                  .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];

                if (existingComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                    body: reviewContent
                  });
                  console.log(`Updated existing comment ${existingComment.id} via search`);
                } else {
                  // Create new comment as last resort
                  await github.rest.issues.createComment({
                    issue_number: prNumber,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: reviewContent
                  });
                  console.log(`Created new comment on PR #${prNumber} as fallback`);
                }
              }
            } else {
              // No initial comment ID, search for existing comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              });

              // Find existing TNT review comment
              const existingComment = comments
                .filter(c => c.body && c.body.includes(marker))
                .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];

              // Add marker and review status
              reviewContent = `${marker}\n**✅ Review Complete**\n\n${reviewContent}`;

              if (existingComment) {
                // Check if comment is less than 1 hour old
                const commentAge = Date.now() - new Date(existingComment.created_at).getTime();
                const oneHour = 60 * 60 * 1000;

                if (commentAge < oneHour) {
                  // Update existing comment if less than 1 hour old
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                    body: reviewContent
                  });
                  console.log(`Updated existing comment ${existingComment.id} (${Math.round(commentAge / 1000 / 60)} minutes old)`);
                } else {
                  // Create new comment if older than 1 hour (preserve history)
                  await github.rest.issues.createComment({
                    issue_number: prNumber,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: reviewContent
                  });
                  console.log(`Created new comment (existing comment was ${Math.round(commentAge / 1000 / 60)} minutes old)`);
                }
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: reviewContent
                });
                console.log(`Created new comment on PR #${prNumber}`);
              }
            }
          } catch (error) {
            console.log('Failed to post comment:', error.message);
            console.log('Error details:', error);
          }

branding:
  icon: "code"
  color: "blue"
